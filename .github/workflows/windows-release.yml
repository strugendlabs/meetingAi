name: Windows signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build Windows audio sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Import trusted Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "A trusted Authenticode certificate is required; unsigned releases are intentionally blocked."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "meetingai-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if (-not $certificate -or -not $certificate.HasPrivateKey) {
            throw "The imported certificate does not include a private key."
          }
          "WINDOWS_CERTIFICATE_SHA1=$($certificate.Thumbprint)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
          Remove-Item $pfxPath -Force

      - name: Sign Windows audio sidecar
        shell: pwsh
        run: ./scripts/sign-windows.ps1 ./src-tauri/binaries/system-audio-x86_64-pc-windows-msvc.exe

      - name: Build signed NSIS installer
        run: npm run tauri build -- --config src-tauri/tauri.windows.conf.json --bundles nsis

      - name: Verify release signatures
        shell: pwsh
        run: |
          $targets = @(
            "./src-tauri/binaries/system-audio-x86_64-pc-windows-msvc.exe",
            "./src-tauri/target/release/meetingai.exe"
          )
          $targets += Get-ChildItem "./src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" |
            ForEach-Object { $_.FullName }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature $target
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature on $target: $($signature.Status)"
            }
            Write-Host "Valid signature: $target [$($signature.SignerCertificate.Subject)]"
          }

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAI-Windows-x64-signed
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
