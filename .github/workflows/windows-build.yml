name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows-build.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Test native Rust backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows x64 installer
        run: npm run tauri build -- --bundles nsis
      - name: Install and test single-instance launch
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - name: Checksum installer
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingAI-Windows-x64-preview
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 30
